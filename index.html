<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Pages Three.js GLB</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #eeeeee; }
        canvas { display: block; }
    </style>
</head>
<body>

    <script type="module">
        import * as THREE from 'https://unpkg.com';
        import { GLTFLoader } from 'https://unpkg.com';
        import { OrbitControls } from 'https://unpkg.com';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xeeeeee);

        // 카메라이 가시거리(Far)를 기존 1000에서 50000으로 크게 늘려 초대형 모델도 안 잘리게 방어
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 50000);
        camera.position.set(0, 5, 10);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 2.0);
        directionalLight.position.set(10, 20, 15);
        scene.add(directionalLight);

        // GitHub Pages 경로 자동 추적
        const currentPath = window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/'));
        const modelUrl = `${window.location.origin}${currentPath}/model.glb`;

        const loader = new GLTFLoader();
        loader.load(
            modelUrl, 
            (gltf) => {
                const model = gltf.scene;
                
                // --- [핵심] AI 모델 크기 및 중심점 강제 정규화 로직 ---
                const box = new THREE.Box3().setFromObject(model);
                const size = box.getSize(new THREE.Vector3());
                const center = box.getCenter(new THREE.Vector3());
                
                console.log("AI 모델 원래 크기(가로,세로,높이):", size);
                console.log("AI 모델 원래 중심점 위치:", center);

                // 모델의 중심을 무조건 (0, 0, 0) 원점으로 강제 이동
                model.position.x += (model.position.x - center.x);
                model.position.y += (model.position.y - center.y);
                model.position.z += (model.position.z - center.z);

                // 모델 크기가 너무 크거나 작으면 가로 세로 중 가장 긴 곳을 기준(3단위)으로 자동 축소/확대
                const maxDim = Math.max(size.x, size.y, size.z);
                if (maxDim > 0) {
                    const scale = 3.0 / maxDim; 
                    model.scale.set(scale, scale, scale);
                    console.log(`모델 스케일이 ${scale} 비율로 자동 조정되었습니다.`);
                }
                // -----------------------------------------------------

                scene.add(model);
                console.log('초대형 AI 모델 보정 및 로드 성공!');
            },
            (xhr) => {
                // 4.6MB 용량의 다운로드 상태 확인용
                if (xhr.total > 0) {
                    console.log((xhr.loaded / xhr.total * 100) + '% 완료');
                } else {
                    console.log(xhr.loaded + ' 바이트 다운로드 중...');
                }
            },
            (error) => {
                console.error('모델 로드 실패 원인:', error);
            }
        );

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
