<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Pages Three.js GLB</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #eeeeee; }
        canvas { display: block; }
    </style>
</head>
<body>

    <script type="module">
        // importmap 에러를 원천 차단하기 위해 CDN 절대 경로 직접 import 사용
        import * as THREE from 'https://unpkg.com';
        import { GLTFLoader } from 'https://unpkg.com';
        import { OrbitControls } from 'https://unpkg.com';

        // 1. 씬 생성
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xeeeeee);

        // 2. 카메라 설정
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 5);

        // 3. 렌더러 설정
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // 4. 컨트롤 추가
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // 5. 조명 설정
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
        directionalLight.position.set(5, 10, 7);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        // 6. GitHub Pages의 현재 주소를 기반으로 GLB 파일 절대 경로 계산 (CORS 방지)
        const currentPath = window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/'));
        const modelUrl = `${window.location.origin}${currentPath}/model.glb`;

        console.log("불러오는 모델 주소:", modelUrl); // 디버깅용 로그

        // 7. GLTF 로더 실행
        const loader = new GLTFLoader();
        loader.load(
            modelUrl, 
            (gltf) => {
                const model = gltf.scene;
                
                // 모델의 중심점을 찾아서 카메라 정중앙에 배치
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                model.position.x += (model.position.x - center.x);
                model.position.y += (model.position.y - center.y);
                model.position.z += (model.position.z - center.z);
                
                scene.add(model);
                console.log('모델 로드 성공!');
            },
            (xhr) => {
                console.log((xhr.loaded / xhr.total * 100) + '% 완료');
            },
            (error) => {
                console.error('모델 로드 중 에러:', error);
            }
        );

        // 8. 창 크기 변경 대응
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 9. 애니메이션 루프
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
