<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js CDN GLB Renderer</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #eeeeee; }
        canvas { display: block; }
    </style>
    <!-- 인터넷을 통해 Three.js 핵심 라이브러리와 확장 모듈을 실시간으로 가져옵니다 -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com",
                "three/addons/": "https://unpkg.com"
            }
        }
    </script>
</head>
<body>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 1. 씬 (Scene) 생성
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xeeeeee);

        // 2. 카메라 (Camera) 설정
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 5);

        // 3. 렌더러 (Renderer) 설정
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // 4. 마우스 제어 조작 (OrbitControls) 추가
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // 5. 조명 (Light) 설정
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
        directionalLight.position.set(5, 10, 7);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        // 6. 인터넷을 통해 로드된 GLTFLoader로 GLB 파일 불러오기
        const loader = new GLTFLoader();
        
        // 중요: 'model.glb' 파일은 html 파일과 같은 폴더에 있어야 합니다.
        loader.load(
            'model.glb', 
            (gltf) => {
                const model = gltf.scene;
                
                // 모델을 화면 중앙으로 정렬하는 로직
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                model.position.x += (model.position.x - center.x);
                model.position.y += (model.position.y - center.y);
                model.position.z += (model.position.z - center.z);
                
                scene.add(model);
                console.log('GLB 모델 로드 성공');
            },
            (xhr) => {
                console.log((xhr.loaded / xhr.total * 100) + '% 로딩됨');
            },
            (error) => {
                console.error('모델 로드 중 에러가 발생했습니다:', error);
            }
        );

        // 7. 창 크기 조절 대응
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 8. 무한 렌더링 루프
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
